name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: dummy-project
      GCS_BUCKET_NAME: dummy-bucket
      BIGQUERY_DATASET: raw
      DBT_DATASET: dbt_brewery
      BIGQUERY_LOCATION: us-central1
      DBT_TARGET: ci
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/fake-gcp-key.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create offline BigQuery service account key
        run: |
          openssl genrsa -out /tmp/fake-private-key.pem 2048
          python - <<'PY'
          import json
          from pathlib import Path

          private_key = Path("/tmp/fake-private-key.pem").read_text()
          key = {
              "type": "service_account",
              "project_id": "dummy-project",
              "private_key_id": "dummy",
              "private_key": private_key,
              "client_email": "dummy@dummy-project.iam.gserviceaccount.com",
              "client_id": "1234567890",
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token",
              "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
              "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/dummy"
          }
          Path("/tmp/fake-gcp-key.json").write_text(json.dumps(key))
          PY

      - name: Compile Python files
        run: python -m compileall dags ingestion great_expectations

      - name: Parse dbt project
        run: dbt parse --project-dir dbt_project --profiles-dir dbt_project --target ci --no-partial-parse
